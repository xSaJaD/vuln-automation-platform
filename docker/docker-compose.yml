# تشغيل: docker compose -f docker/docker-compose.yml up --build
# السياق (context) هو جذر المستودع (..) حتى تُنسخ حزمة api/.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strix}
      POSTGRES_DB: ${POSTGRES_DB:-strix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strix}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    volumes:
      # نتائج الفحص الخام تُحفظ محليًا (strix_runs/) — تُقرأ لاحقًا.
      - ../strix_runs:/app/strix_runs
      # Strix يشغّل كل فحص في sandbox خاص به عبر Docker.
      # ⚠️ منح الوصول لـ docker.sock صلاحية قوية — فعّله فقط في بيئة موثوقة.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
